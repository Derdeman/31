<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grup Ses Odası</title>
  <!-- Trystero Torrent/WebRTC Kütüphanesi -->
  <script type="module">
    import { joinRoom } from 'https://cdn.skypack.dev/trystero/torrent';

    const config = { appId: 'bizim-grup-sesli-sohbet-app' };
    const room = joinRoom(config, 'ana-ses-odasi');

    let localStream = null;
    const audioContainer = document.getElementById('audio-container');
    const statusText = document.getElementById('status-text');
    const joinBtn = document.getElementById('join-btn');

    // 1. Mikrofon izni al
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(stream => {
        localStream = stream;
        statusText.innerText = "🟢 Mikrofon Hazır";
        joinBtn.disabled = false;
      })
      .catch(err => {
        statusText.innerText = "❌ Mikrofon izni reddedildi!";
      });

    // 2. Odaya Katıl
    joinBtn.addEventListener('click', () => {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('room-box').style.display = 'block';

      // Odadakilere kendi sesini gönder
      room.addStream(localStream);

      // Odadaki diğer kişilerin sesleri geldiğinde oynat
      room.onPeerStream((stream, peerId) => {
        let audio = document.getElementById(`audio-${peerId}`);
        if (!audio) {
          audio = document.createElement('audio');
          audio.id = `audio-${peerId}`;
          audio.autoplay = true;
          audioContainer.appendChild(audio);
        }
        audio.srcObject = stream;
      });

      // Biri ayrıldığında sesini kaldır
      room.onPeerLeave(peerId => {
        const audio = document.getElementById(`audio-${peerId}`);
        if (audio) audio.remove();
      });
    });

    document.getElementById('leave-btn').addEventListener('click', () => {
      location.reload();
    });
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #161b22;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #30363d;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #58a6ff; }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 6px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-join { background-color: #238636; color: white; }
    .btn-join:hover { background-color: #2ea043; }
    .btn-leave { background-color: #da3633; color: white; }
    .status { margin-top: 15px; font-size: 14px; color: #8b949e; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔊 Genel Ses Odası</h2>
    
    <div id="login-box">
      <p style="font-size: 13px; color: #8b949e;">Herkes aynı adrese girerek sese katılabilir.</p>
      <button id="join-btn" class="btn-join" disabled>Odaya Katıl</button>
    </div>

    <div id="room-box" style="display: none;">
      <div class="status" style="color: #3fb950; font-size: 16px;">🟢 Odadasın (Ses Açık)</div>
      <button id="leave-btn" class="btn-leave">Odadan Ayrıl</button>
    </div>

    <div class="status" id="status-text">Mikrofon izni bekleniyor...</div>
  </div>

  <div id="audio-container"></div>

</body>
</html>
