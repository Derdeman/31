<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizim Ses Odası</title>
  <!-- PeerJS Kütüphanesi -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background-color: #161b22;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #30363d;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #58a6ff; }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-join { background-color: #238636; color: white; }
    .btn-join:hover { background-color: #2ea043; }
    .btn-leave { background-color: #da3633; color: white; display: none; }
    .btn-leave:hover { background-color: #b62324; }
    .status { margin-top: 15px; font-size: 14px; color: #8b949e; }
    .online-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #3fb950;
      border-radius: 50%;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🔊 Genel Ses Odası</h2>
    <p style="font-size: 13px; color: #8b949e;">Linke sahip olan herkes bu odadadır.</p>

    <div class="status" id="status-text">Mikrofon izni bekleniyor...</div>

    <button id="action-btn" class="btn-join" disabled>Odaya Katıl</button>
  </div>

  <div id="audio-container"></div>

  <script>
    // Ortak Oda Kimliği (Bunu değiştirme, herkes aynı odaya bağlanır)
    const ROOM_ID = "bizim-ozel-ses-odasi-github-2024";
    
    let localStream = null;
    let peer = null;
    let isConnected = false;

    const statusText = document.getElementById('status-text');
    const actionBtn = document.getElementById('action-btn');
    const audioContainer = document.getElementById('audio-container');

    // 1. Sayfa açılınca mikrofon erişimi iste
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(stream => {
        localStream = stream;
        statusText.innerText = "🟢 Mikrofon Hazır";
        actionBtn.disabled = false;
      })
      .catch(err => {
        statusText.innerText = "❌ Mikrofon izni vermelisiniz!";
        console.error("Mikrofon hatası:", err);
      });

    // 2. Butona tıklandığında Odaya Gir / Çık yap
    actionBtn.addEventListener('click', () => {
      if (!isConnected) {
        joinRoom();
      } else {
        leaveRoom();
      }
    });

    function joinRoom() {
      statusText.innerText = "Odaya bağlanıyor...";
      
      // Rastgele bağlantı ID'si ile Peer başlat
      peer = new Peer();

      peer.on('open', myId => {
        isConnected = true;
        statusText.innerHTML = '<span class="online-badge"></span> Odadasın (Ses Açık)';
        actionBtn.innerText = "Odadan Ayrıl";
        actionBtn.className = "btn-leave";

        // Odadaki başkalarını dinlemek için gelen aramaları otomatik kabul et
        peer.on('call', call => {
          call.answer(localStream);
          handleStream(call);
        });

        // Odaya duyuru yap ve mevcut kişileri ara
        connectToGroup();
      });
    }

    function connectToGroup() {
      // Odaya girince sabit odayı ara (bağlantı sinyali)
      const call = peer.call(ROOM_ID, localStream);
      if (call) {
        handleStream(call);
      }
    }

    function handleStream(call) {
      call.on('stream', remoteStream => {
        // Gelen sesi otomatik oynat
        let audio = document.createElement('audio');
        audio.srcObject = remoteStream;
        audio.autoplay = true;
        audioContainer.appendChild(audio);
      });
    }

    function leaveRoom() {
      if (peer) peer.destroy();
      location.reload(); // Sayfayı yenileyerek odadan çık
    }
  </script>
</body>
</html>
