<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genel Ses Odası</title>
  <!-- PeerJS Kütüphanesi -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      box-sizing: border-box;
    }
    input { background: #2a2a2a; color: white; }
    button { background: #5865F2; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #4752C4; }
    .status { color: #57F287; margin-top: 10px; font-size: 14px; }
    .room-view { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Ortak Ses Odası</h2>

    <!-- Giriş Ekranı -->
    <div id="login-view">
      <input type="text" id="username" placeholder="Kullanıcı Adın">
      <button id="join-btn">Odaya Katıl</button>
    </div>

    <!-- Oda Ekranı -->
    <div id="room-view" class="room-view">
      <div class="status">🟢 Odadasın</div>
      <p style="color: #aaa; font-size: 13px;">Odadaki diğer kişilerle sesin otomatik olarak bağlandığında konuşabilirsin.</p>
      <button id="leave-btn" style="background: #ED4245;">Ayrıl</button>
    </div>
  </div>

  <div id="audio-container"></div>

  <script>
    // Sabit Genel Oda İsmi
    const ROOM_ID = "bizim-ortak-ses-odasi-12345";
    
    let peer;
    let localStream;

    // 1. Kullanıcıdan Mikrofon İzni Al
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(stream => {
        localStream = stream;
      })
      .catch(err => {
        alert("Mikrofona erişim izni vermen gerekiyor!");
      });

    // 2. Katıl Butonuna Tıklandığında
    document.getElementById('join-btn').addEventListener('click', () => {
      const username = document.getElementById('username').value.trim();
      if (!username) return alert("Lütfen bir isim yaz!");

      document.getElementById('login-view').style.display = 'none';
      document.getElementById('room-view').style.display = 'block';

      // PeerJS bağlantısını başlat
      peer = new Peer();

      peer.on('open', id => {
        // Odaya bağlanmak için sabit adresi ara
        connectToRoom();
      });

      // Biri bizi aradığında (sesimizi dinlemek istediğinde)
      peer.on('call', call => {
        call.answer(localStream); // Sesimizi gönder
        
        const audio = document.createElement('audio');
        audio.autoplay = true;

        call.on('stream', remoteStream => {
          audio.srcObject = remoteStream;
          document.getElementById('audio-container').appendChild(audio);
        });
      });
    });

    // Odadaki diğer kullanıcılara bağlanma fonksiyonu
    function connectToRoom() {
      // Rastgele oluşan bağlantıyı odaya dahil etme mantığı
      const call = peer.call(ROOM_ID, localStream);

      if (call) {
        const audio = document.createElement('audio');
        audio.autoplay = true;

        call.on('stream', remoteStream => {
          audio.srcObject = remoteStream;
          document.getElementById('audio-container').appendChild(audio);
        });
      }
    }

    // Odadan ayrılma
    document.getElementById('leave-btn').addEventListener('click', () => {
      location.reload();
    });
  </script>
</body>
</html>
