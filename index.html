<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesli Sohbet Odası</title>
  <!-- PeerJS Kütüphanesi -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background-color: #161b22;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #30363d;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #58a6ff; }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #30363d;
      box-sizing: border-box;
      font-size: 14px;
    }
    input { background-color: #0d1117; color: #c9d1d9; }
    button {
      background-color: #238636;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover { background-color: #2ea043; }
    .my-id {
      background-color: #0d1117;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      color: #7ee787;
      word-break: break-all;
    }
    .status { margin-top: 10px; font-size: 13px; color: #8b949e; }
  </style>
</head>
<body>

  <div class="box">
    <h2>Sesli Oda</h2>
    
    <p style="font-size: 13px;">Senin Bağlantı Kodun:</p>
    <div class="my-id" id="my-id">Yükleniyor...</div>

    <hr style="border-color: #30363d; margin: 15px 0;">

    <input type="text" id="target-id" placeholder="Arkadaşının Kodunu Yapıştır">
    <button id="connect-btn">Bağlan ve Konuş</button>

    <div class="status" id="status">Mikrofon izni bekleniyor...</div>
  </div>

  <div id="audio-container"></div>

  <script>
    let localStream;
    let peer;

    // 1. Mikrofon İzni Al
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(stream => {
        localStream = stream;
        document.getElementById('status').innerText = "🟢 Mikrofon Aktif";
        initPeer();
      })
      .catch(err => {
        document.getElementById('status').innerText = "❌ Mikrofon İzni Reddedildi!";
      });

    // 2. PeerJS Bağlantısını Başlat
    function initPeer() {
      peer = new Peer();

      peer.on('open', id => {
        document.getElementById('my-id').innerText = id;
      });

      // Biri seni aradığında otomatik cevap ver ve sesini dinle
      peer.on('call', call => {
        call.answer(localStream);
        handleStream(call);
      });
    }

    // 3. Arkadaşının Kodunu Girip Bağlanma
    document.getElementById('connect-btn').addEventListener('click', () => {
      const targetId = document.getElementById('target-id').value.trim();
      if (!targetId) return alert("Lütfen arkadaşının kodunu gir!");

      document.getElementById('status').innerText = "Bağlanıyor...";
      const call = peer.call(targetId, localStream);
      handleStream(call);
    });

    // Gelen sesi oynatma fonksiyonu
    function handleStream(call) {
      call.on('stream', remoteStream => {
        document.getElementById('status').innerText = "🔊 Bağlantı Kuruldu!";
        const audio = document.createElement('audio');
        audio.srcObject = remoteStream;
        audio.autoplay = true;
        document.getElementById('audio-container').appendChild(audio);
      });
    }
  </script>
</body>
</html>
