<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesli Sohbet Odası</title>
  <!-- PeerJS Kütüphanesi -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      width: 320px;
      text-align: center;
    }
    input, button {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: none;
    }
    input { background: #2c2c2c; color: white; }
    button { background: #007bff; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
    .status { margin-top: 10px; font-size: 14px; color: #888; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Sesli Sohbet</h2>
    
    <p>Senin ID'n:</p>
    <h3 id="my-id" style="color: #00ff88;">Yükleniyor...</h3>

    <hr style="border-color: #333;">

    <input type="text" id="peer-id-input" placeholder="Arkadaşının ID'sini yaz">
    <button id="call-btn">Sese Bağlan</button>

    <div class="status" id="status-text">Durum: Bekleniyor...</div>
  </div>

  <!-- Karşı tarafın sesini oynatacak gizli ses öğesi -->
  <audio id="remote-audio" autoplay></audio>

  <script>
    const peer = new Peer(); // Rastgele bir Peer ID oluşturur
    let localStream;

    // 1. Kullanıcının mikrofonuna erişim al
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(stream => {
        localStream = stream;
        document.getElementById('status-text').innerText = "Mikrofon aktif, bağlanmaya hazır.";
      })
      .catch(err => {
        console.error("Mikrofon izni alınamadı:", err);
        document.getElementById('status-text').innerText = "Hata: Mikrofona erişilemedi!";
      });

    // 2. Kendi Peer ID'ni ekranda göster
    peer.on('open', id => {
      document.getElementById('my-id').innerText = id;
    });

    // 3. Biri seni aradığında aramayı kabul et
    peer.on('call', call => {
      document.getElementById('status-text').innerText = "Biri bağlandı!";
      call.answer(localStream); // Kendi sesini gönder

      call.on('stream', remoteStream => {
        // Karşı tarafın sesini dinle
        document.getElementById('remote-audio').srcObject = remoteStream;
      });
    });

    // 4. Arkadaşını aramak için butona tıkla
    document.getElementById('call-btn').addEventListener('click', () => {
      const friendId = document.getElementById('peer-id-input').value;
      if (!friendId) {
        alert("Lütfen arkadaşının ID'sini gir!");
        return;
      }

      document.getElementById('status-text').innerText = "Aranıyor...";
      const call = peer.call(friendId, localStream);

      call.on('stream', remoteStream => {
        document.getElementById('status-text').innerText = "Sesli bağlantı kuruldu!";
        document.getElementById('remote-audio').srcObject = remoteStream;
      });
    });
  </script>
</body>
</html>
